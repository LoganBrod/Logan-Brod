<!--
  The browser tab.

  The same drawing as `LogoMark` in app/components/Logo.tsx, and it has to stay
  that way: a tab icon and a header logo that disagree read as two companies.

  Fixed colours, not the palette variables — a favicon is composited by the
  browser chrome against a tab strip, not against the page, so it cannot follow
  the site's palette. The dark plate is what makes the teal legible, and it
  reads on a light tab strip and a dark one alike.

  Letters drawn as paths rather than set in a face: a favicon cannot wait for a
  webfont. Checked at 16, 32 and 64 rather than eyeballed at one size — the
  strokes are this heavy because at 16px anything lighter closes up.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8.5" fill="#46585B" />
  <rect x="2.6" y="2.6" width="26.8" height="26.8" rx="6.4" fill="#16201E" />
  <!-- L in grey, Z in teal. -->
  <path d="M8.4 8h3.2v8.3h4.6v3.2H8.4Z" fill="#A3ACAD" />
  <path d="M17.3 8h7.3v2.8l-4.6 5.5h4.6v3.2h-7.5v-2.8l4.6-5.5h-4.4Z" fill="#33D6C3" />
  <rect x="12.6" y="21.4" width="6.8" height="2.4" rx="1.2" fill="#33D6C3" />
</svg>
