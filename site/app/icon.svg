<!--
  The browser tab, which until now 404'd on every page of the site.

  Drawn rather than lettered: at 16px a glyph from the display face is a smudge,
  and the one shape this product is about that survives being that small is a
  hanger. Two paths and a heavy stroke, so it still holds together when a tab is
  inactive and the browser greys it out.

  The geometry was checked at 16, 32 and 64 rather than eyeballed at one size.
  An earlier version had a larger hook set off to the right of the apex, which
  looked deliberate at 64px and looked broken at 16.

  Fixed colours, not the palette variables. A favicon is composited by the
  browser chrome against a tab strip, not against the page, so it cannot follow
  prefers-color-scheme the way the site does - an off-black plate with the
  accent on it reads on a light tab strip and a dark one alike.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0D0D0F" />
  <g fill="none" stroke="#4FA07A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The hook, and the neck down to the shoulder point. -->
    <path d="M13.9 10.3a2.1 2.1 0 1 1 2.1 2.1v1.6" />
    <!-- The bar, with both shoulders running down to it. -->
    <path d="M16 14 6 22.5h20L16 14Z" />
  </g>
</svg>
