<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --ink: #1f1f1f; --muted: #5f6368; --line: #dadce0; --blue: #1a73e8; --red: #d93025; --amber: #b06000; --green: #188038; }
  * { box-sizing: border-box; }
  body { font: 13px/1.5 "Google Sans", Roboto, Arial, sans-serif; color: var(--ink); margin: 0; padding: 14px; }
  h2 { font-size: 13px; font-weight: 500; margin: 16px 0 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 18px; padding: 7px 14px; border: 1px solid var(--line); background: #fff; color: var(--blue); cursor: pointer; }
  button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 2px 10px; font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .status { margin-top: 12px; color: var(--muted); }
  .error { color: var(--red); }
  .text { font-size: 16px; line-height: 2; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .unknown { background: #fbd5d5; border-radius: 3px; }
  .new { background: #fdeeb8; border-radius: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; border-radius: 12px; padding: 2px 9px; border: 1px solid; }
  .chip.ok { color: var(--green); border-color: #a8dab5; background: #e6f4ea; }
  .chip.no { color: var(--red); border-color: #f6aea9; background: #fce8e6; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid #f1f3f4; }
  .w { font-size: 16px; }
  .why { color: var(--muted); font-size: 12px; }
  .badge { border-radius: 8px; padding: 8px 10px; margin-top: 12px; }
  .badge.ok { background: #e6f4ea; color: var(--green); }
  .badge.no { background: #fce8e6; color: var(--red); }
  .flex { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
</style>
</head>
<body>
  <div class="row">
    <button class="primary" id="check" onclick="check()">Check</button>
    <button id="fix" onclick="fix()">Fix with what I've learned</button>
  </div>
  <div class="hint">Works on your selection, or the whole document if nothing is selected. <span class="unknown">Red</span> = not in your material, <span class="new">yellow</span> = new word from characters you know.</div>
  <div class="status" id="status"></div>
  <div id="out"></div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  function busy(on, msg) { $("check").disabled = on; $("fix").disabled = on; $("status").className = "status"; $("status").textContent = msg || ""; }
  function fail(e) { busy(false); $("status").className = "status error"; $("status").textContent = (e && e.message) || String(e); }

  function tokensHtml(tokens) {
    return tokens.map(function (t) {
      var cls = t.status === "unknown" ? "unknown" : t.status === "new" ? "new" : "";
      return cls ? '<span class="' + cls + '" title="' + esc(t.status === "unknown" ? "Not in your material" : "New word, known characters") + '">' + esc(t.text) + "</span>" : esc(t.text);
    }).join("");
  }
  function chipsHtml(structures) {
    if (!structures.length) return '<div class="hint">No tracked grammar structures here.</div>';
    return '<div class="chips">' + structures.map(function (s) {
      return '<span class="chip ' + (s.learned ? "ok" : "no") + '" title="' + esc(s.hint) + '">' + (s.learned ? "✓ " : "✗ ") + esc(s.name) + "</span>";
    }).join("") + "</div>";
  }
  function flaggedHtml(flagged) {
    if (!flagged.length) return '<div class="badge ok">Every word is from your material.</div>';
    return "<h2>Not in your material (" + flagged.length + ")</h2><ul>" + flagged.map(function (f, i) {
      return '<li class="flex"><span class="w ' + (f.status === "unknown" ? "unknown" : "new") + '">' + esc(f.word) + '</span><span class="why grow">' +
        (f.status === "unknown" ? "unknown: " + esc(f.unknownChars || "") : "known characters") +
        '</span><button class="small" id="allow' + i + '" onclick="allow(' + i + ')">Learned it</button></li>';
    }).join("") + "</ul>";
  }

  var lastFlagged = [];
  function check() {
    busy(true, "Checking…");
    google.script.run.withSuccessHandler(function (r) {
      busy(false, "Checked the " + r.scope + ". " + r.painted + " spot" + (r.painted === 1 ? "" : "s") + " highlighted in the document.");
      lastFlagged = r.result.flagged;
      $("out").innerHTML = "<h2>Grammar structures</h2>" + chipsHtml(r.result.structures) + flaggedHtml(lastFlagged);
    }).withFailureHandler(fail).checkDocument();
  }
  function allow(i) {
    var f = lastFlagged[i]; var b = $("allow" + i); b.disabled = true; b.textContent = "Saving…";
    google.script.run.withSuccessHandler(function () { b.textContent = "Added"; }).withFailureHandler(fail).allowWord(f.word);
  }

  var lastChanges = [];
  function fix() {
    busy(true, "Fixing and verifying against your material… (up to a minute)");
    google.script.run.withSuccessHandler(function (r) {
      busy(false, "Nothing in the document changes until you apply a change.");
      lastChanges = r.changes || [];
      var html = r.verified
        ? '<div class="badge ok">Verified: every word and structure in this correction is from your material' + (r.attempts > 1 ? " (" + r.attempts + " tries)" : "") + ".</div>"
        : '<div class="badge no">Not verified after ' + r.attempts + " tries. Still outside your material: " + esc([].concat(r.violations.words, r.violations.structures).join("、")) + "</div>";
      html += "<h2>Corrected " + esc(r.scope) + '</h2><div class="text">' + tokensHtml(r.result.tokens) + "</div>";
      if (lastChanges.length) {
        html += '<h2 class="flex"><span class="grow">Changes (' + lastChanges.length + ')</span><button class="small" onclick="applyAll()">Apply all</button></h2><ul>' + lastChanges.map(function (c, i) {
          return '<li><div class="flex"><span class="grow"><s style="color:#5f6368">' + esc(c.original) + "</s> → <b>" + esc(c.corrected) + '</b></span><button class="small" id="apply' + i + '" onclick="applyOne(' + i + ')">Apply</button></div><div class="why">' + esc(c.why) + "</div></li>";
        }).join("") + "</ul>";
      } else if (r.verified) html += '<div class="hint">No errors found.</div>';
      if (r.note) html += '<h2>Could not fix with what you\'ve learned</h2><div class="why">' + esc(r.note) + "</div>";
      html += "<h2>Grammar structures</h2>" + chipsHtml(r.result.structures);
      $("out").innerHTML = html;
    }).withFailureHandler(fail).fixDocument();
  }
  function applyOne(i, done) {
    var c = lastChanges[i], b = $("apply" + i);
    if (!b || b.disabled) { if (done) done(); return; }
    b.disabled = true; b.textContent = "…";
    google.script.run.withSuccessHandler(function (ok) { b.textContent = ok ? "Applied" : "Not found"; if (done) done(); })
      .withFailureHandler(function (e) { fail(e); if (done) done(); }).applyChange(c.original, c.corrected);
  }
  function applyAll() { var i = 0; (function next() { if (i < lastChanges.length) applyOne(i++, next); })(); }
</script>
</body>
</html>
